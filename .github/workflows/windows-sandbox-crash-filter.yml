name: Windows x64 sandbox crash filter

on:
  workflow_dispatch:
  push:
    branches:
      - work/windows-x64-crash-filter
  pull_request:
    branches:
      - main
    paths:
      - "src/sandbox/**"
      - "test/unittests/sandbox/**"
      - "BUILD.gn"
      - "test/unittests/BUILD.gn"
      - ".github/workflows/windows-sandbox-crash-filter.yml"

concurrency:
  group: windows-x64-crash-filter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Check out V8 fork
        uses: actions/checkout@v4
        with:
          path: v8-windws

      - name: Check out depot_tools
        shell: pwsh
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:GITHUB_WORKSPACE\depot_tools"

      - name: Add depot_tools to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install required Windows SDK
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\\Installer\\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio installation was not found."
          }
          Write-Host "Using Visual Studio at: $vsPath"

          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\\10\\Include'
          $sdkPath = Join-Path $sdkRoot '10.0.28000.0'
          if (-not (Test-Path $sdkPath)) {
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\\Installer\\setup.exe'
            if (-not (Test-Path $installer)) {
              throw "Visual Studio Installer setup.exe was not found: $installer"
            }
            & $installer modify --installPath $vsPath --add Microsoft.VisualStudio.Component.Windows11SDK.28000 --quiet --norestart --wait
            $installerExitCode = $LASTEXITCODE
            Write-Host "Visual Studio Installer exit code: $installerExitCode"
            if ($installerExitCode -ne 0) {
              throw "Visual Studio Installer failed to add Windows SDK 10.0.28000.0 (exit $installerExitCode)."
            }
          }

          if (-not (Test-Path $sdkPath)) {
            Write-Host "Installed Windows SDK include directories:"
            if (Test-Path $sdkRoot) {
              Get-ChildItem $sdkRoot -Directory | ForEach-Object { Write-Host $_.Name }
            } else {
              Write-Host "SDK include root not found: $sdkRoot"
            }
            throw "Windows SDK 10.0.28000.0 is still missing after Visual Studio Installer completed."
          }
          Write-Host "Verified Windows SDK 10.0.28000.0 at $sdkPath."

      - name: Sync V8 dependencies
        shell: pwsh
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
        run: |
          gclient config --unmanaged https://github.com/${{ github.repository }}.git
          gclient sync --no-history

      - name: Run V8 hooks
        shell: pwsh
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
        run: |
          gclient runhooks

      - name: Generate Windows x64 build
        shell: pwsh
        working-directory: v8-windws
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
        run: |
          @(
            "is_debug = false"
            'target_cpu = "x64"'
            "v8_enable_sandbox = true"
          ) | Set-Content -Path windows-x64-args.gn -Encoding ascii
          gn gen out.gn/x64.release --args-file=windows-x64-args.gn

      - name: Build d8 and unit tests
        shell: pwsh
        working-directory: v8-windws
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
        run: |
          autoninja -C out.gn/x64.release d8 unittests

      - name: Run Windows sandbox crash-filter tests
        shell: pwsh
        working-directory: v8-windws
        run: |
          .\out.gn\x64.release\unittests.exe --gtest_filter='WindowsSandboxCrashFilter*'

      - name: Upload d8.exe
        uses: actions/upload-artifact@v4
        with:
          name: d8-windows-x64
          path: v8-windws/out.gn/x64.release/d8.exe
          if-no-files-found: error
          retention-days: 7
