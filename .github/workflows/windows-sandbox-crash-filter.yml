name: Windows x64 sandbox crash filter

on:
  workflow_dispatch:
  push:
    branches:
      - work/windows-x64-crash-filter
  pull_request:
    branches:
      - main
    paths:
      - "src/sandbox/**"
      - "test/unittests/sandbox/**"
      - "BUILD.gn"
      - "test/unittests/BUILD.gn"
      - ".github/workflows/windows-sandbox-crash-filter.yml"

concurrency:
  group: windows-x64-crash-filter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Check out V8 fork
        uses: actions/checkout@v4
        with:
          path: v8-windws

      - name: Check out depot_tools
        shell: pwsh
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:GITHUB_WORKSPACE\depot_tools"

      - name: Add depot_tools to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install required Windows SDK
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio installation was not found."
          }
          Write-Host "Using Visual Studio at: $vsPath"

          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdkPath = Join-Path $sdkRoot '10.0.28000.0'
          if (-not (Test-Path $sdkPath)) {
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            if (-not (Test-Path $installer)) {
              throw "Visual Studio Installer setup.exe was not found: $installer"
            }
            $installerArgs = @(
              'modify'
              '--installPath'
              "`"$vsPath`""
              '--add'
              'Microsoft.VisualStudio.Component.Windows11SDK.28000'
              '--quiet'
              '--norestart'
            )
            $installerProcess = Start-Process -FilePath $installer -ArgumentList $installerArgs -Wait -PassThru -NoNewWindow
            $installerExitCode = $installerProcess.ExitCode
            Write-Host "Visual Studio Installer exit code: $installerExitCode"
            if ($installerExitCode -ne 0) {
              throw "Visual Studio Installer failed to add Windows SDK 10.0.28000.0 (exit $installerExitCode)."
            }
          }

          if (-not (Test-Path $sdkPath)) {
            Write-Host "Installed Windows SDK include directories:"
            if (Test-Path $sdkRoot) {
              Get-ChildItem $sdkRoot -Directory | ForEach-Object { Write-Host $_.Name }
            } else {
              Write-Host "SDK include root not found: $sdkRoot"
            }
            throw "Windows SDK 10.0.28000.0 is still missing after Visual Studio Installer completed."
          }
          Write-Host "Verified Windows SDK 10.0.28000.0 at $sdkPath."

      - name: Sync V8 dependencies
        shell: pwsh
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
        run: |
          gclient config --unmanaged https://github.com/${{ github.repository }}.git
          gclient sync --no-history

      - name: Run V8 hooks
        shell: pwsh
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
        run: |
          gclient runhooks

      - name: Generate Windows x64 build
        shell: pwsh
        working-directory: v8-windws
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
        run: |
          @(
            "is_debug = false"
            "is_component_build = false"
            'target_cpu = "x64"'
            "v8_enable_sandbox = true"
          ) | Set-Content -Path windows-x64-args.gn -Encoding ascii
          gn gen out.gn/x64.release --args-file=windows-x64-args.gn

      - name: Build d8 and unit tests
        shell: pwsh
        working-directory: v8-windws
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
        run: |
          autoninja -C out.gn/x64.release d8 v8_unittests

      - name: Run Windows sandbox crash-filter tests
        shell: pwsh
        working-directory: v8-windws
        run: |
          .\out.gn\x64.release\v8_unittests.exe --gtest_filter='WindowsSandboxCrashFilter*'

      - name: Smoke-test and package standalone d8
        shell: pwsh
        working-directory: v8-windws
        run: |
          $outDir = "out.gn/x64.release"
          $d8 = Join-Path $outDir "d8.exe"
          if (-not (Test-Path $d8)) {
            throw "d8.exe was not produced."
          }

          # A static V8 build must not leave d8.exe dependent on v8.dll.
          $dependencies = (& dumpbin /nologo /dependents $d8 | Out-String)
          Write-Host $dependencies
          if ($dependencies -match 'v8\.dll') {
            throw "d8.exe still imports v8.dll; refusing to publish an incomplete executable."
          }

          & $d8 --version
          if ($LASTEXITCODE -ne 0) {
            throw "d8 --version failed with exit code $LASTEXITCODE."
          }

          "print('d8-smoke-ok:', 6 * 7);" | Set-Content -Path "$outDir/smoke.js" -Encoding ascii
          $smokeOutput = & $d8 "$outDir/smoke.js" 2>&1 | Out-String
          Write-Host $smokeOutput
          if ($LASTEXITCODE -ne 0 -or $smokeOutput -notmatch 'd8-smoke-ok:\s*42') {
            throw "d8 JavaScript smoke test failed."
          }

          $dist = "dist/d8-windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item $d8 $dist
          # Preserve optional runtime data and any non-V8 DLLs if the selected
          # V8 configuration emits them beside d8.exe.
          Get-ChildItem $outDir -File | Where-Object {
            $_.Extension -in @(".dll", ".dat") -or $_.Name -eq "snapshot_blob.bin"
          } | Copy-Item -Destination $dist -Force
          Get-ChildItem $dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload runnable d8 distribution
        uses: actions/upload-artifact@v4
        with:
          name: d8-windows-x64
          path: v8-windws/dist/d8-windows-x64/**
          if-no-files-found: error
          retention-days: 7
