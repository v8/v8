[package]
name = "garage"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal UI for viewing, navigating and diffing V8 trace output"
license = "BSD-3-Clause"
publish = false

[dependencies]
anyhow = { path = "../../third_party/rust/chromium_crates_io/vendor/anyhow-v1" }
regex = { package = "regex-lite", path = "../../third_party/rust/chromium_crates_io/vendor/regex-lite-v0_1" }

[target.'cfg(unix)'.dependencies]
libc = { path = "../../third_party/rust/chromium_crates_io/vendor/libc-v0_2" }

[dev-dependencies]
serde_json = { path = "../../third_party/rust/chromium_crates_io/vendor/serde_json-v1" }

[patch.crates-io]
itoa = { path = "../../third_party/rust/chromium_crates_io/vendor/itoa-v1" }
memchr = { path = "../../third_party/rust/chromium_crates_io/vendor/memchr-v2" }
serde_core = { path = "../../third_party/rust/chromium_crates_io/vendor/serde_core-v1" }
zmij = { path = "../../third_party/rust/chromium_crates_io/vendor/zmij-v1" }

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
